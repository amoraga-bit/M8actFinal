name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Validar sintaxis
        run: node -c src/index.js

      - name: Confirmar build listo para Railway
        run: echo "✅ Validación completa. Railway desplegará automáticamente este push."